{% extends "base.html" %}
{% block content %}
<div class="flex between">
  <h1>Products</h1>
  <a class="btn" href="/orders/new">Start an order</a>
</div>
<div class="grid cols-3" id="product-grid" style="margin-top:20px;"></div>
<div id="empty" class="empty-state" style="display:none;">No products available right now.</div>
{% endblock %}
{% block scripts %}
<script>
  (async () => {
    try {
      const products = await OrderFlow.api("/api/products?limit=100", { auth: false });
      const grid = document.getElementById("product-grid");
      if (products.length === 0) {
        document.getElementById("empty").style.display = "block";
        return;
      }
      grid.innerHTML = products.map(p => `
        <div class="card product-card">
          <h3><a href="/products/${p.id}">${p.name}</a></h3>
          <p class="muted" style="font-size:0.85rem;">${(p.description || "").slice(0, 90)}</p>
          <span class="price">${OrderFlow.money(p.price)}</span>
          <span class="stock">${p.stock_quantity > 0 ? p.stock_quantity + " in stock" : "Out of stock"}</span>
          <a class="btn small secondary" href="/products/${p.id}">View details</a>
        </div>
      `).join("");
    } catch (err) {
      console.error(err);
    }
  })();
</script>
{% endblock %}
