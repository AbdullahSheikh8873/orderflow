{% extends "base.html" %}
{% block container_class %} narrow{% endblock %}
{% block content %}
<div class="card">
  <h1>Create your account</h1>
  <div id="alert-box"></div>
  <form id="register-form">
    <div class="form-group">
      <label for="name">Full name</label>
      <input type="text" id="name" required minlength="2" />
    </div>
    <div class="form-group">
      <label for="email">Email</label>
      <input type="email" id="email" required />
    </div>
    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" required minlength="8" />
      <div class="muted" style="font-size:0.78rem; margin-top:4px;">At least 8 characters.</div>
    </div>
    <button class="btn" type="submit" style="width:100%;">Sign up</button>
  </form>
  <p class="muted" style="margin-top:16px;">Already have an account? <a href="/login">Log in</a></p>
</div>
{% endblock %}
{% block scripts %}
<script>
  document.getElementById("register-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const alertBox = document.getElementById("alert-box");
    alertBox.innerHTML = "";
    try {
      const data = await OrderFlow.api("/api/auth/register", {
        method: "POST",
        auth: false,
        body: {
          name: document.getElementById("name").value,
          email: document.getElementById("email").value,
          password: document.getElementById("password").value,
        },
      });
      OrderFlow.setSession(data.access_token, data.user);
      window.location.href = "/dashboard";
    } catch (err) {
      OrderFlow.showAlert(alertBox, err.message);
    }
  });
</script>
{% endblock %}
