{% extends "base.html" %}
{% block content %}
<h1>Manage Products</h1>
<div class="nav-links" style="margin:8px 0 20px;">
  <a href="/admin">Overview</a>
  <a href="/admin/products" class="active">Products</a>
  <a href="/admin/orders">Orders</a>
  <a href="/admin/users">Customers</a>
  <a href="/admin/events">Event Logs</a>
</div>

<div id="alert-box"></div>

<div class="card">
  <h2>Add a product</h2>
  <form id="product-form">
    <div class="grid cols-2">
      <div class="form-group"><label>Name</label><input id="p-name" required /></div>
      <div class="form-group"><label>Price</label><input id="p-price" type="number" step="0.01" min="0.01" required /></div>
      <div class="form-group"><label>Stock quantity</label><input id="p-stock" type="number" min="0" required /></div>
      <div class="form-group"><label>Image URL (optional)</label><input id="p-image" /></div>
    </div>
    <div class="form-group"><label>Description</label><textarea id="p-description" rows="2"></textarea></div>
    <button class="btn" type="submit">Add Product</button>
  </form>
</div>

<div class="card" style="margin-top:20px;">
  <h2>All Products</h2>
  <table id="products-table">
    <thead><tr><th>Name</th><th>Price</th><th>Stock</th><th>Status</th><th></th></tr></thead>
    <tbody></tbody>
  </table>
</div>
{% endblock %}
{% block scripts %}
<script>
  OrderFlow.requireAdmin();

  async function loadProducts() {
    const products = await OrderFlow.api("/api/admin/products?limit=200");
    document.querySelector("#products-table tbody").innerHTML = products.map(p => `
      <tr>
        <td>${p.name}</td>
        <td>${OrderFlow.money(p.price)}</td>
        <td>${p.stock_quantity}</td>
        <td>${p.is_active ? "Active" : "Deactivated"}</td>
        <td>${p.is_active ? `<button class="btn small danger" data-id="${p.id}">Deactivate</button>` : ""}</td>
      </tr>
    `).join("");

    document.querySelectorAll("#products-table button[data-id]").forEach(btn => {
      btn.addEventListener("click", async () => {
        if (!confirm("Deactivate this product?")) return;
        try {
          await OrderFlow.api(`/api/products/${btn.dataset.id}`, { method: "DELETE" });
          loadProducts();
        } catch (err) {
          OrderFlow.showAlert(document.getElementById("alert-box"), err.message);
        }
      });
    });
  }

  document.getElementById("product-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const alertBox = document.getElementById("alert-box");
    alertBox.innerHTML = "";
    try {
      await OrderFlow.api("/api/products", {
        method: "POST",
        body: {
          name: document.getElementById("p-name").value,
          price: parseFloat(document.getElementById("p-price").value),
          stock_quantity: parseInt(document.getElementById("p-stock").value, 10),
          image_url: document.getElementById("p-image").value || null,
          description: document.getElementById("p-description").value || null,
        },
      });
      e.target.reset();
      loadProducts();
    } catch (err) {
      OrderFlow.showAlert(alertBox, err.message);
    }
  });

  loadProducts();
</script>
{% endblock %}
