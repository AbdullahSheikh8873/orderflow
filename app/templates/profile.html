{% extends "base.html" %}
{% block container_class %} narrow{% endblock %}
{% block content %}
<h1>Profile</h1>
<div class="card" id="profile-card">Loading...</div>
{% endblock %}
{% block scripts %}
<script>
  OrderFlow.requireAuth();
  (async () => {
    try {
      const user = await OrderFlow.api("/api/auth/me");
      document.getElementById("profile-card").innerHTML = `
        <div class="form-group"><label>Name</label><input value="${user.name}" disabled /></div>
        <div class="form-group"><label>Email</label><input value="${user.email}" disabled /></div>
        <div class="form-group"><label>Role</label><input value="${user.role}" disabled /></div>
        <div class="form-group"><label>Member since</label><input value="${OrderFlow.formatDate(user.created_at)}" disabled /></div>
      `;
    } catch (err) {
      document.getElementById("profile-card").innerHTML = `<div class="alert error">${err.message}</div>`;
    }
  })();
</script>
{% endblock %}
