{% extends "base.html" %}
{% block content %}
<div class="flex between">
  <h1>My Orders</h1>
  <a class="btn" href="/orders/new">New Order</a>
</div>
<div class="card" style="margin-top:16px;">
  <table id="orders-table">
    <thead><tr><th>Order #</th><th>Status</th><th>Total</th><th>Placed</th><th></th></tr></thead>
    <tbody></tbody>
  </table>
  <div id="empty" class="empty-state" style="display:none;">You haven't placed any orders yet.</div>
</div>
{% endblock %}
{% block scripts %}
<script>
  OrderFlow.requireAuth();
  (async () => {
    try {
      const orders = await OrderFlow.api("/api/orders?limit=100");
      const tbody = document.querySelector("#orders-table tbody");
      if (orders.length === 0) {
        document.getElementById("empty").style.display = "block";
        return;
      }
      tbody.innerHTML = orders.map(o => `
        <tr>
          <td><a href="/orders/${o.id}">${o.order_number}</a></td>
          <td>${OrderFlow.badge(o.status)}</td>
          <td>${OrderFlow.money(o.total_amount)}</td>
          <td>${OrderFlow.formatDate(o.created_at)}</td>
          <td><a href="/orders/${o.id}">Details</a></td>
        </tr>
      `).join("");
    } catch (err) {
      console.error(err);
    }
  })();
</script>
{% endblock %}
