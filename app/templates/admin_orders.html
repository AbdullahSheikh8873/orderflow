{% extends "base.html" %}
{% block content %}
<h1>Manage Orders</h1>
<div class="nav-links" style="margin:8px 0 20px;">
  <a href="/admin">Overview</a>
  <a href="/admin/products">Products</a>
  <a href="/admin/orders" class="active">Orders</a>
  <a href="/admin/users">Customers</a>
  <a href="/admin/events">Event Logs</a>
</div>

<div id="alert-box"></div>

<div class="card">
  <div class="flex between">
    <h2>All Orders</h2>
    <select id="status-filter" style="width:200px;">
      <option value="">All statuses</option>
      <option value="PENDING">Pending</option>
      <option value="PROCESSING">Processing</option>
      <option value="CONFIRMED">Confirmed</option>
      <option value="COMPLETED">Completed</option>
      <option value="CANCELLED">Cancelled</option>
      <option value="FAILED">Failed</option>
    </select>
  </div>
  <table id="orders-table">
    <thead><tr><th>Order #</th><th>Customer</th><th>Status</th><th>Total</th><th>Placed</th><th>Update status</th></tr></thead>
    <tbody></tbody>
  </table>
</div>

<script id="transitions-data" type="application/json">
  {"PENDING": ["PROCESSING", "CANCELLED"], "PROCESSING": ["CONFIRMED", "FAILED"], "CONFIRMED": ["COMPLETED"], "COMPLETED": [], "CANCELLED": [], "FAILED": []}
</script>
{% endblock %}
{% block scripts %}
<script>
  OrderFlow.requireAdmin();
  const transitions = JSON.parse(document.getElementById("transitions-data").textContent);

  async function loadOrders() {
    const statusFilter = document.getElementById("status-filter").value;
    const qs = statusFilter ? `&status=${statusFilter}` : "";
    const orders = await OrderFlow.api(`/api/admin/orders?limit=200${qs}`);

    document.querySelector("#orders-table tbody").innerHTML = orders.map(o => {
      const nextOptions = transitions[o.status] || [];
      const select = nextOptions.length
        ? `<select data-order-id="${o.id}" class="status-select">
             <option value="">Change status…</option>
             ${nextOptions.map(s => `<option value="${s}">${s}</option>`).join("")}
           </select>`
        : `<span class="muted">No further transitions</span>`;
      return `
        <tr>
          <td><a href="/orders/${o.id}">${o.order_number}</a></td>
          <td>User #${o.user_id}</td>
          <td>${OrderFlow.badge(o.status)}</td>
          <td>${OrderFlow.money(o.total_amount)}</td>
          <td>${OrderFlow.formatDate(o.created_at)}</td>
          <td>${select}</td>
        </tr>
      `;
    }).join("");

    document.querySelectorAll(".status-select").forEach(sel => {
      sel.addEventListener("change", async () => {
        if (!sel.value) return;
        try {
          await OrderFlow.api(`/api/orders/${sel.dataset.orderId}/status`, {
            method: "PATCH",
            body: { status: sel.value },
          });
          loadOrders();
        } catch (err) {
          OrderFlow.showAlert(document.getElementById("alert-box"), err.message);
        }
      });
    });
  }

  document.getElementById("status-filter").addEventListener("change", loadOrders);
  loadOrders();
</script>
{% endblock %}
